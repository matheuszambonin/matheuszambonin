name: Gráficos do perfil

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-no-main

jobs:
  graficos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Relevo 3D das contribuições
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: config/relevo-3d.json

      - name: Card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&locale=pt-br&bg_color=EFE7D6&title_color=5A4630&text_color=2E2A24&icon_color=6E7B4F&border_color=C9B48A
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Card de sequência
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&locale=pt_BR&disable_animations=true&background=EFE7D6&border=C9B48A&stroke=C9B48A&ring=6E7B4F&fire=6E7B4F&currStreakNum=2E2A24&sideNums=2E2A24&currStreakLabel=5A4630&sideLabels=5A4630&dates=8A6F47
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/relevo.svg profile/stats.svg profile/streak.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualiza gráficos do perfil"
          git pull --rebase
          git push
